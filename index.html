<!doctype html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo list</title>
</head>

<body>
  <div class="container">
    <header>
      <h1>Min lista</h1>
    </header>

    <section class="add">
      <h2>Lägg till</h2>
      <form id="todo-form">
        <ul id="error" class="error"></ul>

        <label for="task-input">Ny uppgift</label>
        <input type="text" id="task-input" name="task-input" placeholder="Ex. Plugga, träna, kolla hockey">

        <label for="priority-select">Prioritet</label>
        <select id="priority-select">
          <option value="" selected disabled>Välj prioritet</option>
          <option value="1" class="high">Hög</option>
          <option value="2" class="medium">Medel</option>
          <option value="3" class="low">Låg</option>
        </select>
        <button type="submit">Lägg till</button>
      </form>
    </section>

    <section class="todo">
      <div class="todo-top">
        <h2>Ska göras</h2>
        <button id="sort" class="sort">Sortera prio</button>
      </div>



      <ul id="todo-list" class="todo-list"></ul>
      <span id="task-message" class="message"></span>
    </section>

    <section class="completed">
      <h2>Färdigt</h2>
      <ul id="completed-list" class="completed-list"></ul>
      <span id="completed-message" class="message"></span>
    </section>

  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
